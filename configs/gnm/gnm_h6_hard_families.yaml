# H6 hard-route-family diagnostic fine-tune.
# Controlled: identical pipeline/hyperparameters to the H1 incumbent / H4 / H5
# runs; the ONLY change is the training data = 10 H6 hard-route-family scripted
# demonstrations (uturn/chain/ftL/sharpmulti/tightcorr, a+b), selected on the 2
# H6 compound-turn validation episodes. Weights-only init from the retained H1
# hospital incumbent; fresh optimizer. NOT a promotion run.
#
# Claim boundary (carried from h6_claim_boundary.md): scripted-expert demos on a
# FIXED placeholder goal image (h2_weave_J). This measures route-family-diverse
# scripted imitation under the current pipeline, NOT stronger goal-image
# conditioning. Diagnostic only; no promotion, no SOTA/real-robot/goal-cond claim.
model:
  context_size: 5
  goal_conditioned: true
  action_dim: 2
  hidden_dim: 256
  encoder: mobilenet
  out_dim: 512
  pretrained: true
data:
  data_root: datasets/isaac_hospital_h6
  image_size: [96, 96]
  max_goal_dist: 20
  action_std: [0.115528, 0.115528]   # same normalization as incumbent/H3-clean/H4/H5
  augment: true
  num_workers: 4
  pin_memory: true
training:
  epochs: 50
  batch_size: 128
  lr: 1e-4
  weight_decay: 1e-4
  warmup_frac: 0.05
  max_grad_norm: 1.0
  action_weight: 0.5
  loss_type: mse
  patience: 10
  seed: 42
  init_ckpt: checkpoints/hospital_front_rgb_finetune/best.pt   # H1 incumbent, weights only, fresh optimizer
checkpoint:
  output_dir: checkpoints/h6_hard_families_finetune
  log_every: 50
wandb:
  project: fleetsafe-gnm-vlnverse
  entity: null
  name: h6_hard_families_seed42
  tags: [gnm, track_A, hospital, h6, hard_route_families, diagnostic]
  notes: "H6 hard-route-family diagnostic (10 hard-family scripted demos: uturn/chain/ftL/sharpmulti/tightcorr a+b); init weights-only from H1 incumbent; select on H6 compound-turn val; fixed placeholder goal; not a promotion run."
evaluation:
  success_threshold: 3.0
  stop_threshold: 0.15
  max_steps: 500
  track: A
